<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monthly Utilities GL Summary</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f7fb;
      color: #1f2937;
      padding: 16px;
      margin: 0;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: white;
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 14px;
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    .header p {
      margin: 0;
      font-size: 14px;
    }

    .card {
      background: white;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.7fr 0.8fr;
      gap: 14px;
      align-items: start;
    }

    label {
      font-size: 13px;
      font-weight: bold;
      color: #6b7280;
    }

    input,
    select {
      width: 100%;
      padding: 6px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      box-sizing: border-box;
      font-size: 13px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      border-bottom: 1px solid #e5e7eb;
      padding: 5px;
      text-align: left;
      font-size: 13px;
    }

    th {
      background: #f9fafb;
      color: #6b7280;
      font-size: 12px;
    }

    .invoice-order {
      width: 45px;
      text-align: center;
    }

    .amount-input {
      width: 85px;
      text-align: right;
    }

    .category-select {
      width: 90px;
    }

    .gl-display {
      width: 60px;
      text-align: center;
      background: #f3f4f6;
      font-weight: bold;
      color: #111827;
    }

    .type-input {
      min-width: 100%;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: bold;
      cursor: pointer;
      background: #2563eb;
      color: white;
      margin: 6px 6px 0 0;
      font-size: 13px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .secondary:hover {
      background: #d1d5db;
    }

    .danger {
      background: #fee2e2;
      color: #b91c1c;
      padding: 6px 9px;
    }

    .danger:hover {
      background: #fecaca;
    }

    .fixed-fee {
      background: #eff6ff;
      font-weight: bold;
    }

    .credit-row {
      background: #fff7ed;
    }

    .summary-table td:nth-child(2),
    .summary-table th:nth-child(2) {
      text-align: right;
    }

    .summary-table td:nth-child(3),
    .summary-table th:nth-child(3) {
      text-align: center;
    }

    .copy-gl-btn {
      background: #e5e7eb;
      color: #111827;
      padding: 5px 10px;
      margin: 0;
      font-size: 11px;
      min-width: 55px;
    }

    .copy-gl-btn:hover {
      background: #d1d5db;
    }

    .grand-total {
      font-weight: bold;
      background: #f3f4f6;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 10px;
      font-family: Consolas, monospace;
      box-sizing: border-box;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="header">
      <h1>Monthly Utilities GL Summary</h1>
      <p>
        Enter monthly utility amounts. CC fee stays fixed at $3.07.
        Credits can be added only when needed.
      </p>
    </div>


    <div class="card">
      <label>Month</label>
      <input id="month" type="month" style="max-width: 180px;" />
    </div>


    <div class="layout">

      <div class="card">

        <h2 style="margin-top:0;">Monthly Entry</h2>

        <table>

          <thead>
            <tr>
              <th style="width:55px;">Order</th>
              <th style="width:95px;">Amount</th>
              <th style="width:95px;">Category</th>
              <th style="width:70px;">GL</th>
              <th>Type</th>
              <th style="width:50px;">X</th>
            </tr>
          </thead>

          <tbody id="entryBody"></tbody>

        </table>


        <button onclick="addRow()">
          + Add Row
        </button>

        <button onclick="addCreditRow()">
          + Add Credit Row
        </button>

        <button
          class="secondary"
          onclick="clearAmountsOnly()">
          Clear Amounts Only
        </button>

        <button
          class="secondary"
          onclick="resetTemplate()">
          Reset Template
        </button>

      </div>


      <div class="card">

        <h2 style="margin-top:0;">GL Summary</h2>

        <table class="summary-table">

          <thead>
            <tr>
              <th>GL</th>
              <th>Amount</th>
              <th style="width:70px;"></th>
            </tr>
          </thead>

          <tbody id="summaryBody"></tbody>

        </table>


        <button onclick="copySummary()">
          Copy Summary
        </button>

        <button
          class="secondary"
          onclick="window.print()">
          Print / Save PDF
        </button>


        <h2>Copy/Paste Summary</h2>

        <textarea
          id="copyBox"
          readonly></textarea>

      </div>

    </div>

  </div>


  <script>

    const defaultRows = [
      {
        amount: '',
        category: 'Water',
        gl: '7902',
        type: 'Domestic Water',
        invoiceOrder: '1'
      },
      {
        amount: '',
        category: 'Water',
        gl: '7902',
        type: 'Sewer/Wastewater',
        invoiceOrder: '2'
      },
      {
        amount: '',
        category: 'Waste',
        gl: '7906',
        type: 'Solid Waste',
        invoiceOrder: '3'
      },
      {
        amount: '',
        category: 'Water',
        gl: '7902',
        type: 'Stormwater',
        invoiceOrder: '4'
      },
      {
        amount: '',
        category: 'Gas',
        gl: '7905',
        type: 'Natural Gas',
        invoiceOrder: '5'
      },
      {
        amount: '',
        category: 'Water',
        gl: '7902',
        type: 'Reclaimed Water',
        invoiceOrder: '6'
      },
      {
        amount: '',
        category: 'Gas',
        gl: '7905',
        type: 'Utility Tax on Gas',
        invoiceOrder: '7'
      },
      {
        amount: '',
        category: 'Water',
        gl: '7902',
        type: 'Utility Tax on Water',
        invoiceOrder: '8'
      },
      {
        amount: '',
        category: 'Water',
        gl: '7902',
        type: 'Franchise Fee',
        invoiceOrder: '9'
      },
      {
        amount: '',
        category: 'Water',
        gl: '7902',
        type: 'State Gross Tax',
        invoiceOrder: '10'
      },
      {
        amount: '3.07',
        category: 'Water',
        gl: '7902',
        type: 'CC FEE',
        invoiceOrder: '',
        fixed: true
      }
    ];


    let rows = [];


    function setCurrentMonth() {
      const today = new Date();

      document.getElementById('month').value =
        today.getFullYear() +
        '-' +
        String(today.getMonth() + 1).padStart(2, '0');
    }


    function money(value) {
      return (Number(value) || 0).toLocaleString('en-US', {
        style: 'currency',
        currency: 'USD'
      });
    }


    function resetTemplate() {
      rows = JSON.parse(JSON.stringify(defaultRows));
      render();
    }


    function getGLByCategory(category) {
      if (category === 'Water') return '7902';
      if (category === 'Gas') return '7905';
      if (category === 'Waste') return '7906';

      return '';
    }


    function addRow() {
      rows.push({
        amount: '',
        category: 'Water',
        gl: '7902',
        type: '',
        invoiceOrder: ''
      });

      render();
    }


    function addCreditRow() {
      rows.push({
        amount: '',
        category: 'Water',
        gl: '7902',
        type: 'Credits',
        invoiceOrder: ''
      });

      render();
    }


    function clearAmountsOnly() {
      rows = rows.map(row => {

        if (row.fixed) return row;

        return {
          ...row,
          amount: ''
        };

      });

      render();
    }


    function removeRow(index) {
      rows.splice(index, 1);
      render();
    }


    function updateRow(index, field, value) {
      rows[index][field] = value;

      if (field === 'category') {
        rows[index].gl = getGLByCategory(value);
      }

      render();
    }


    function render() {

      const entryBody =
        document.getElementById('entryBody');

      entryBody.innerHTML = '';


      rows.forEach((row, index) => {

        const tr =
          document.createElement('tr');


        if (row.fixed) {
          tr.classList.add('fixed-fee');
        }


        if (row.type === 'Credits') {
          tr.classList.add('credit-row');
        }


        tr.innerHTML = `
          <td>
            <input
              class="invoice-order"
              type="text"
              value="${row.invoiceOrder || ''}"
              onchange="updateRow(${index}, 'invoiceOrder', this.value)">
          </td>

          <td>
            <input
              class="amount-input"
              type="number"
              step="0.01"
              value="${row.amount}"
              ${row.fixed ? 'readonly' : ''}
              onchange="updateRow(${index}, 'amount', this.value)">
          </td>

          <td>
            <select
              class="category-select"
              onchange="updateRow(${index}, 'category', this.value)">

              <option
                value="Water"
                ${row.category === 'Water' ? 'selected' : ''}>
                Water
              </option>

              <option
                value="Gas"
                ${row.category === 'Gas' ? 'selected' : ''}>
                Gas
              </option>

              <option
                value="Waste"
                ${row.category === 'Waste' ? 'selected' : ''}>
                Waste
              </option>

            </select>
          </td>

          <td>
            <input
              class="gl-display"
              type="text"
              value="${row.gl || ''}"
              readonly>
          </td>

          <td>
            <input
              class="type-input"
              type="text"
              value="${row.type || ''}"
              onchange="updateRow(${index}, 'type', this.value)">
          </td>

          <td>
            <button
              class="danger"
              onclick="removeRow(${index})"
              ${
                row.fixed
                  ? 'disabled style="opacity:.4; cursor:not-allowed;"'
                  : ''
              }>
              X
            </button>
          </td>
        `;


        entryBody.appendChild(tr);

      });


      renderSummary();
    }


    function renderSummary() {

      const summary = {
        '7902': 0,
        '7905': 0,
        '7906': 0
      };


      rows.forEach(row => {

        const gl =
          row.gl || 'No GL';

        const amount =
          Number(row.amount) || 0;


        if (!Object.prototype.hasOwnProperty.call(summary, gl)) {
          summary[gl] = 0;
        }


        summary[gl] += amount;

      });


      const summaryBody =
        document.getElementById('summaryBody');


      summaryBody.innerHTML = '';


      let grandTotal = 0;


      Object.keys(summary)
        .sort()
        .forEach(gl => {

          const amount =
            summary[gl];


          grandTotal += amount;


          const tr =
            document.createElement('tr');


          const glCell =
            document.createElement('td');

          glCell.textContent =
            gl;


          const amountCell =
            document.createElement('td');

          amountCell.textContent =
            money(amount);


          const copyCell =
            document.createElement('td');


          const copyButton =
            document.createElement('button');


          copyButton.type =
            'button';

          copyButton.className =
            'copy-gl-btn';

          copyButton.textContent =
            'Copy';


          copyButton.addEventListener(
            'click',
            function () {

              copyAmount(
                amount,
                copyButton
              );

            }
          );


          copyCell.appendChild(
            copyButton
          );


          tr.appendChild(
            glCell
          );

          tr.appendChild(
            amountCell
          );

          tr.appendChild(
            copyCell
          );


          summaryBody.appendChild(
            tr
          );

        });


      const totalRow =
        document.createElement('tr');


      totalRow.classList.add(
        'grand-total'
      );


      const totalLabel =
        document.createElement('td');

      totalLabel.textContent =
        'Grand Total';


      const totalAmount =
        document.createElement('td');

      totalAmount.textContent =
        money(grandTotal);


      const totalCopyCell =
        document.createElement('td');


      const totalCopyButton =
        document.createElement('button');


      totalCopyButton.type =
        'button';

      totalCopyButton.className =
        'copy-gl-btn';

      totalCopyButton.textContent =
        'Copy';


      totalCopyButton.addEventListener(
        'click',
        function () {

          copyAmount(
            grandTotal,
            totalCopyButton
          );

        }
      );


      totalCopyCell.appendChild(
        totalCopyButton
      );


      totalRow.appendChild(
        totalLabel
      );

      totalRow.appendChild(
        totalAmount
      );

      totalRow.appendChild(
        totalCopyCell
      );


      summaryBody.appendChild(
        totalRow
      );


      updateCopyBox(
        summary,
        grandTotal
      );
    }


    function updateCopyBox(
      summary,
      grandTotal
    ) {

      const monthValue =
        document.getElementById('month').value;


      const monthText =
        monthValue
          ? new Date(
              monthValue + '-01'
            ).toLocaleString(
              'en-US',
              {
                month: 'long',
                year: 'numeric'
              }
            )
          : '';


      let text = '';


      if (monthText) {
        text +=
          `${monthText} Utilities GL Summary\n\n`;
      }


      text +=
        `GL\tAmount\n`;


      Object.keys(summary)
        .sort()
        .forEach(gl => {

          text +=
            `${gl}\t${money(summary[gl])}\n`;

        });


      text +=
        `Grand Total\t${money(grandTotal)}`;


      document.getElementById(
        'copyBox'
      ).value = text;
    }


    function copyAmount(
      amount,
      button
    ) {

      const value =
        Number(amount).toFixed(2);


      const temp =
        document.createElement('textarea');


      temp.value =
        value;


      temp.setAttribute(
        'readonly',
        ''
      );


      temp.style.position =
        'fixed';

      temp.style.top =
        '-1000px';

      temp.style.left =
        '-1000px';


      document.body.appendChild(
        temp
      );


      temp.focus();

      temp.select();

      temp.setSelectionRange(
        0,
        temp.value.length
      );


      let copied = false;


      try {

        copied =
          document.execCommand('copy');

      } catch (error) {

        copied = false;

      }


      document.body.removeChild(
        temp
      );


      if (copied) {

        button.textContent =
          'Copied!';


        setTimeout(
          function () {

            button.textContent =
              'Copy';

          },
          1000
        );

      } else {

        button.textContent =
          'Try Again';


        setTimeout(
          function () {

            button.textContent =
              'Copy';

          },
          1200
        );

      }
    }


    function copySummary() {

      const copyBox =
        document.getElementById('copyBox');


      copyBox.focus();

      copyBox.select();

      copyBox.setSelectionRange(
        0,
        copyBox.value.length
      );


      document.execCommand(
        'copy'
      );


      alert(
        'Summary copied!'
      );
    }


    document.addEventListener(
      'keydown',
      function(e) {

        if (e.key === 'Enter') {

          const active =
            document.activeElement;


          if (
            active &&
            active.classList.contains(
              'amount-input'
            )
          ) {

            e.preventDefault();


            const inputs =
              Array.from(
                document.querySelectorAll(
                  '.amount-input'
                )
              );


            const index =
              inputs.indexOf(active);


            if (
              index > -1 &&
              index < inputs.length - 1
            ) {

              inputs[
                index + 1
              ].focus();


              inputs[
                index + 1
              ].select();

            }
          }
        }
      }
    );


    document
      .getElementById('month')
      .addEventListener(
        'change',
        renderSummary
      );


    setCurrentMonth();

    resetTemplate();

  </script>

</body>
</html>
